
name: Build AdaptivePokerStudy with native TexasSolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input archives
        shell: bash
        run: |
          set -euo pipefail
          test -f AdaptivePokerStudy_v060.zip
          test -f TexasSolverAndroidPort_v2.zip

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aps-project
          unzip -q AdaptivePokerStudy_v060.zip -d /tmp/aps-project
          cp -a /tmp/aps-project/AdaptivePokerAndroid/. .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          test -d "$SDK_ROOT/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

          cmake --version

      - name: Unpack TexasSolver Android port
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/aps-native-port
          unzip -q TexasSolverAndroidPort_v2.zip -d /tmp/aps-native-port

          test -f /tmp/aps-native-port/TexasSolverAndroidPort/apply_texassolver_android.py

      - name: Integrate TexasSolver C++ source and JNI
        shell: bash
        run: |
          set -euo pipefail

          PORT_ROOT="/tmp/aps-native-port/TexasSolverAndroidPort"

          python3 "$PORT_ROOT/apply_texassolver_android.py"

          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/java/com/adaptivepoker/study/TexasSolverBridge.java
          test -f app/src/main/assets/solver-ui.js

      - name: Fix native evaluator asset path and solver UI
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          bridge = Path(
              "app/src/main/java/com/adaptivepoker/study/TexasSolverBridge.java"
          )

          source = bridge.read_text(encoding="utf-8")

          old_asset = "solver/card5_dic_sorted.txt.gz"
          new_asset = "solver/card5_dic_sorted.txt.gzip"

          if old_asset not in source:
              raise SystemExit(
                  "ERROR: Original evaluator asset path not found in Java bridge"
              )

          source = source.replace(old_asset, new_asset)
          bridge.write_text(source, encoding="utf-8")

          print("Java evaluator path patched:")
          print(new_asset)

          ui = Path("app/src/main/assets/solver-ui.js")
          js = ui.read_text(encoding="utf-8")

          old_color = "color:var(--fg,#17202a)"
          new_color = "color:var(--text,#f2f5f9)"

          if old_color not in js:
              raise SystemExit("ERROR: Solver panel CSS color not found")

          js = js.replace(old_color, new_color, 1)

          old_call = """    run.disabled = true;
              run.textContent = 'Вычисление…';
              status.textContent = 'Подготовка справочника и запуск TexasSolver. Не закрывайте приложение.';
              window.TexasSolver.solve(JSON.stringify(payload));"""

          new_call = """    run.disabled = true;
              run.textContent = 'Вычисление…';
              status.textContent = 'Запрос передан нативному движку. Подготовка справочника…';

              window.setTimeout(() => {
                try {
                  window.TexasSolver.solve(JSON.stringify(payload));
                } catch (error) {
                  run.disabled = false;
                  run.textContent = 'Запустить solve';
                  status.textContent =
                    'Ошибка запуска: ' +
                    (error && error.message ? error.message : String(error));
                }
              }, 50);"""

          if old_call not in js:
              raise SystemExit("ERROR: Solver button handler pattern not found")

          js = js.replace(old_call, new_call, 1)
          ui.write_text(js, encoding="utf-8")

          print("Solver UI patched.")
          PY

      - name: Fetch and gzip official TexasSolver evaluator
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch console \
            https://github.com/bupticybee/TexasSolver.git \
            /tmp/TexasSolver-upstream

          git -C /tmp/TexasSolver-upstream sparse-checkout set resources/compairer

          SOURCE="/tmp/TexasSolver-upstream/resources/compairer/card5_dic_sorted.txt"
          ASSET_DIR="app/src/main/assets/solver"
          DEST="$ASSET_DIR/card5_dic_sorted.txt.gzip"

          if [ ! -s "$SOURCE" ]; then
            echo "ERROR: Original evaluator not found"
            find /tmp/TexasSolver-upstream -iname '*card5*'
            exit 1
          fi

          mkdir -p "$ASSET_DIR"

          rm -f \
            "$ASSET_DIR/card5_dic_sorted.txt" \
            "$ASSET_DIR/card5_dic_sorted.txt.gz" \
            "$DEST"

          # .gzip сохраняет имя в APK.
          # Java bridge самостоятельно распакует gzip-поток.
          gzip -9 -c "$SOURCE" > "$DEST"

          gzip -t "$DEST"

          UNCOMPRESSED_SIZE="$(gzip -dc "$DEST" | wc -c | tr -d '[:space:]')"

          if [ "$UNCOMPRESSED_SIZE" -lt 40000000 ]; then
            echo "ERROR: Evaluator is unexpectedly small"
            exit 1
          fi

          echo "Compressed evaluator:"
          ls -lh "$DEST"

          echo "Uncompressed size: $UNCOMPRESSED_SIZE bytes"
          sha256sum "$DEST"

          echo "TexasSolver revision:"
          git -C /tmp/TexasSolver-upstream rev-parse HEAD

      - name: JavaScript and core tests
        shell: bash
        run: |
          set -euo pipefail

          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/solver-ui.js
          node tests/mobile-core.test.js

      - name: Build APK with NDK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify evaluator inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          import gzip

          apk = sys.argv[1]

          target = "assets/solver/card5_dic_sorted.txt.gzip"

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              if target not in names:
                  sys.exit("ERROR: GZIP evaluator missing from APK")

              if "assets/solver/card5_dic_sorted.txt" in names:
                  sys.exit("ERROR: Unexpected plain evaluator duplicate")

              data = z.read(target)

              if data[:2] != b"\x1f\x8b":
                  sys.exit("ERROR: Evaluator is not a valid GZIP stream")

              unpacked = gzip.decompress(data)

              print("Evaluator:", target)
              print("Compressed size:", len(data), "bytes")
              print("Uncompressed size:", len(unpacked), "bytes")

              if len(unpacked) < 40000000:
                  sys.exit("ERROR: Evaluator unexpectedly small")

          print("Evaluator verification: OK")
          PY

      - name: Verify ARM64 library and JNI symbols
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          import subprocess
          import tempfile
          from pathlib import Path

          apk = sys.argv[1]

          bridge = Path(
              "app/src/main/java/com/adaptivepoker/study/TexasSolverBridge.java"
          )

          java_source = bridge.read_text(encoding="utf-8")

          if "solver/card5_dic_sorted.txt.gzip" not in java_source:
              sys.exit("ERROR: Java bridge still uses wrong evaluator path")

          if 'System.loadLibrary("texassolver_jni")' not in java_source:
              sys.exit("ERROR: JNI library load declaration missing")

          library = "lib/arm64-v8a/libtexassolver_jni.so"

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              if library not in names:
                  sys.exit("ERROR: ARM64 TexasSolver library missing")

              lib_data = z.read(library)

          if len(lib_data) < 100000:
              sys.exit("ERROR: Native library unexpectedly small")

          with tempfile.TemporaryDirectory() as tmp:
              lib_path = Path(tmp) / "libtexassolver_jni.so"
              lib_path.write_bytes(lib_data)

              result = subprocess.run(
                  ["readelf", "-Ws", str(lib_path)],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  sys.exit("ERROR: Cannot inspect native library")

              symbols = result.stdout

              required = [
                  "Java_com_adaptivepoker_study_TexasSolverBridge_nativeRun",
                  "Java_com_adaptivepoker_study_TexasSolverBridge_nativeVersion"
              ]

              for symbol in required:
                  if symbol not in symbols:
                      sys.exit("ERROR: JNI symbol missing: " + symbol)

          print("ARM64 library:", library)
          print("Native library size:", len(lib_data), "bytes")
          print("JNI nativeRun: OK")
          print("JNI nativeVersion: OK")
          print("Bridge evaluator path: OK")
          PY

      - name: Prepare APK artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-output

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"

          if [ -n "$APK" ]; then
            cp "$APK" \
              build-output/AdaptivePokerStudy-native-TexasSolver-arm64-debug.apk

            ls -lh build-output/
          else
            echo "APK was not created."
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdaptivePokerStudy-native-TexasSolver-arm64-debug
          path: build-output/AdaptivePokerStudy-native-TexasSolver-arm64-debug.apk
          if-no-files-found: warn
          
