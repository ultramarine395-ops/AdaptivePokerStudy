
name: Build AdaptivePokerStudy with native TexasSolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input archives
        shell: bash
        run: |
          set -euo pipefail
          test -f AdaptivePokerStudy_v060.zip
          test -f TexasSolverAndroidPort_v2.zip

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aps-project
          unzip -q AdaptivePokerStudy_v060.zip -d /tmp/aps-project
          cp -a /tmp/aps-project/AdaptivePokerAndroid/. .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          test -d "$SDK_ROOT/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

          cmake --version

      - name: Unpack TexasSolver Android port
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/aps-native-port
          unzip -q TexasSolverAndroidPort_v2.zip -d /tmp/aps-native-port

          test -f /tmp/aps-native-port/TexasSolverAndroidPort/apply_texassolver_android.py

      - name: Integrate TexasSolver C++ source and JNI
        shell: bash
        run: |
          set -euo pipefail

          PORT_ROOT="/tmp/aps-native-port/TexasSolverAndroidPort"

          python3 "$PORT_ROOT/apply_texassolver_android.py"

          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/java/com/adaptivepoker/study/TexasSolverBridge.java

      - name: Fetch official TexasSolver evaluator
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch console \
            https://github.com/bupticybee/TexasSolver.git \
            /tmp/TexasSolver-upstream

          git -C /tmp/TexasSolver-upstream sparse-checkout set resources/compairer

          SOURCE="/tmp/TexasSolver-upstream/resources/compairer/card5_dic_sorted.txt"
          DEST="app/src/main/assets/solver/card5_dic_sorted.txt"
          GZIP="app/src/main/assets/solver/card5_dic_sorted.txt.gz"

          if [ ! -s "$SOURCE" ]; then
            echo "ERROR: Original evaluator not found"
            find /tmp/TexasSolver-upstream -iname '*card5*'
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"

          # Оставляем только gzip-файл:
          # native Android port ожидает именно card5_dic_sorted.txt.gz.
          rm -f "$DEST" "$GZIP"

          gzip -9 -c "$SOURCE" > "$GZIP"

          gzip -t "$GZIP"

          UNCOMPRESSED_SIZE="$(gzip -dc "$GZIP" | wc -c | tr -d '[:space:]')"

          if [ "$UNCOMPRESSED_SIZE" -lt 40000000 ]; then
            echo "ERROR: Evaluator is unexpectedly small"
            exit 1
          fi

          echo "Compressed evaluator:"
          ls -lh "$GZIP"

          echo "Uncompressed evaluator size: $UNCOMPRESSED_SIZE bytes"
          sha256sum "$SOURCE"
          sha256sum "$GZIP"

          echo "TexasSolver revision:"
          git -C /tmp/TexasSolver-upstream rev-parse HEAD

          test ! -e "$DEST"

      - name: JavaScript and core tests
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node tests/mobile-core.test.js

      - name: Build APK with NDK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify evaluator inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          import gzip

          apk = sys.argv[1]
          target = "assets/solver/card5_dic_sorted.txt.gz"
          plain = "assets/solver/card5_dic_sorted.txt"

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              if target not in names:
                  sys.exit("ERROR: Compressed evaluator missing from APK")

              if plain in names:
                  sys.exit("ERROR: Duplicate uncompressed evaluator in APK")

              compressed = z.read(target)
              data = gzip.decompress(compressed)

              print("Evaluator:", target)
              print("Compressed size:", len(compressed), "bytes")
              print("Uncompressed size:", len(data), "bytes")

              if len(data) < 40000000:
                  sys.exit("ERROR: Evaluator unexpectedly small")
          PY

      - name: Verify ARM64 library and JNI bridge
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          import re
          from pathlib import Path

          apk = sys.argv[1]

          bridge = Path(
              "app/src/main/java/com/adaptivepoker/study/TexasSolverBridge.java"
          )

          if not bridge.exists():
              sys.exit("ERROR: JNI bridge missing")

          source = bridge.read_text()

          loaded = re.findall(
              r'System\.loadLibrary\("([^"]+)"\)',
              source
          )

          if not loaded:
              sys.exit("ERROR: No System.loadLibrary declaration")

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              libraries = [
                  n for n in names
                  if n.startswith("lib/arm64-v8a/") and n.endswith(".so")
              ]

              if not libraries:
                  sys.exit("ERROR: No ARM64 native libraries in APK")

              for name in loaded:
                  expected = f"lib/arm64-v8a/lib{name}.so"
                  if expected not in names:
                      sys.exit(f"ERROR: JNI library missing: {expected}")

              print("ARM64 libraries:")
              for lib in libraries:
                  print(lib)

              print("JNI libraries verified:", loaded)
          PY

      - name: Verify TexasSolver native payload
        shell: bash
        run: |
          set -euo pipefail

          PORT_ROOT="/tmp/aps-native-port/TexasSolverAndroidPort"
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"

          if [ -f "$PORT_ROOT/verify_native_apk.py" ]; then
            python3 "$PORT_ROOT/verify_native_apk.py" "$APK"
          else
            echo "ERROR: Native APK verifier missing from port package"
            exit 1
          fi

      - name: Prepare APK artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-output

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"

          if [ -n "$APK" ]; then
            cp "$APK" build-output/AdaptivePokerStudy-native-TexasSolver-arm64-debug.apk
            ls -lh build-output/
          else
            echo "APK was not created."
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdaptivePokerStudy-native-TexasSolver-arm64-debug
          path: build-output/AdaptivePokerStudy-native-TexasSolver-arm64-debug.apk
          if-no-files-found: warn
          
