name: Bootstrap and build AdaptivePokerStudy with GTOpen + TexasSolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository with source archive
        uses: actions/checkout@v4

      - name: Locate uploaded source archive
        id: source-archive
        shell: bash
        run: |
          set -euo pipefail
          # Detect the archive already uploaded to the repository.
          for candidate in AdaptivePokerStudy_v070.zip APS_v070_download.zip; do
            if [[ -f "$candidate" ]]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using source archive: $candidate"
              exit 0
            fi
          done
          echo "Source archive not found. Expected AdaptivePokerStudy_v070.zip or APS_v070_download.zip in repository root."
          ls -la
          exit 1

      - name: Unpack Android project into repository root
        run: |
          mkdir -p /tmp/aps-project
          unzip -q "${{ steps.source-archive.outputs.path }}" -d /tmp/aps-project
          test -d /tmp/aps-project/AdaptivePokerAndroid/app
          cp -a /tmp/aps-project/AdaptivePokerAndroid/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-37' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Integrate pinned TexasSolver C++ engine
        run: python3 scripts/apply_texassolver_android.py

      - name: Fetch pinned GTOpen preflop core
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MatthewPDingle/GTOpen.git /tmp/GTOpen
          git -C /tmp/GTOpen sparse-checkout init --cone
          git -C /tmp/GTOpen sparse-checkout set crates/solver
          git -C /tmp/GTOpen fetch --depth=1 origin 153f41f186037014646f3a63158a5636e58ef8a3
          git -C /tmp/GTOpen checkout --detach FETCH_HEAD
          mkdir -p rust/vendor app/src/main/assets
          cp -a /tmp/GTOpen/crates/solver rust/vendor/solver
          cp /tmp/GTOpen/Cargo.lock rust/Cargo.lock
          cp /tmp/GTOpen/crates/solver/cache/preflop_eq169.bin app/src/main/assets/preflop_eq169.bin
          test "$(stat -c%s app/src/main/assets/preflop_eq169.bin)" -eq 114248
          python3 scripts/patch_gto_android.py rust/vendor/solver/src/preflop/mod.rs

      - name: Check and smoke-test Rust preflop bridge on host
        run: |
          cargo check --manifest-path rust/Cargo.toml --lib
          cargo test --manifest-path rust/Cargo.toml --lib

      - name: Build GTOpen native library for Android ARM64
        run: cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --manifest-path rust/Cargo.toml --release

      - name: Run JavaScript checks
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/solver-ui.js
          node tests/mobile-core.test.js

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify both native engines in APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          python3 scripts/verify_native_apk.py "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdaptivePokerStudy-GTOpen-TexasSolver-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
