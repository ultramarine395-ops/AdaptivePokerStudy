
name: Unpack project and build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p /tmp/project
          unzip -q AdaptivePokerStudy_v060.zip -d /tmp/project
          cp -a /tmp/project/AdaptivePokerAndroid/. .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

     
      - name: Android SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi




      - name: Tests
        run: |
          node --check app/src/main/assets/app.js
          node tests/mobile-core.test.js

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AdaptivePokerStudy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
